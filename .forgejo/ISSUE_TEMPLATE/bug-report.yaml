name: Bug Report
description: Report a bug in Kitae
title: "[BUG]: "
labels: ["bug", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  - type: input
    id: app_version
    attributes:
      label: Kitae Version
      description: What version of Kitae are you running?
      placeholder: "e.g., 1.3.3"
    validations:
      required: true

  - type: input
    id: android_version
    attributes:
      label: Android Version
      description: What version of Android are you using?
      placeholder: "e.g., Android 12"
    validations:
      required: true

  - type: dropdown
    id: what_happened
    attributes:
      label: How often does this bug occur?
      options:
        - Crash
        - Freeze
        - No action
        - Other (Describe in `Additional Information`)
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: A clear description of what you expected to happen.
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often does this bug occur?
      options:
        - Every time
        - Frequently
        - Sometimes
        - Rarely
        - Only once
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output if available.
      render: shell

  - type: textarea
    id: additional_info
    attributes:
      label: Additional Information
      description: Add any other context about the problem here.
