name: Feature Request
description: Suggest a new feature for Kitae
title: "[FEATURE]: "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature for Kitae!

  - type: dropdown
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      options:
        - Yes
        - No
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Describe the feature
      description: A clear and concise description of what you want.
      placeholder: I would like the app to [...]
    validations:
      required: true

  - type: dropdown
    id: importance
    attributes:
      label: How important is this feature to you?
      options:
        - Critical (I can't use the app without it)
        - High (Would significantly improve my experience)
        - Medium (Would be a nice addition)
        - Low (Just an idea)
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context, screenshots, or mockups about the feature request here.
