name: Minor Request
description: Request something for Kitae
title: "[REQUEST]: "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Hello ><!

  - type: dropdown
    id: problem
    attributes:
      label: Is your request related to a problem?
      options:
        - Yes
        - No
    validations:
      required: false

  - type: textarea
    id: request
    attributes:
      label: Describe the request
      description: A clear and concise description of what you want.
      placeholder: I would like the app to [...]
    validations:
      required: true

  - type: dropdown
    id: importance
    attributes:
      label: How important is this feature to you?
      options:
        - Medium (Would be a nice addition)
        - Low (Just an idea)
    validations:
      required: true
